name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Prepare workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Host tests
        run: |
          . "$IDF_PATH/export.sh"
          tools/test.sh
      - name: Integrated build
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-app -D SDKCONFIG="$PWD/build-app/sdkconfig" -D SDKCONFIG_DEFAULTS="sdkconfig.defaults" build
      - name: HTTP client log protection
        run: python tools/check_http_log_cap.py build-app
      - name: Dependency lock unchanged
        run: git diff --exit-code dependencies.lock
